<!DOCTYPE html>

<head>

<title>找不到頁面｜蔡明劭醫師</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0E8F79;--accent:#16BFA1;--paler:#E9F8F3;--ink:#12201C;--g3:#65726D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC',-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff 0%,var(--paler) 100%);padding:24px;text-align:center}
.code{font-family:'Outfit',sans-serif;font-weight:700;font-size:72px;color:var(--deep);line-height:1;margin:0 0 12px}

.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px}
.primary{background:var(--deep);color:#fff}
.secondary{background:#fff;color:var(--deep);border:1.5px solid var(--deep)}
</style>
</head>
<body>
<main>
<p class="code">404</p>
